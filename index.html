<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#d4edd6" />
    <title>Banana Monkey Incremental</title>
    <link data-trunk rel="copy-file" href="diagnostics.js" />
    <script src="diagnostics.js" defer></script>
    <link data-trunk rel="rust" />
    <link data-trunk rel="copy-dir" href="assets" />
    <style>
      :root {
        color-scheme: light;
        background: #d4edd6;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
      }

      body {
        padding-top: env(safe-area-inset-top);
        padding-right: env(safe-area-inset-right);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
      }

      #banana-monkey-canvas {
        display: block;
        outline: none;
        image-rendering: pixelated;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <canvas id="banana-monkey-canvas" tabindex="0"></canvas>
  </body>
</html>
