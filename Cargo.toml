[package]
name = "banana-monkey-incremental"
version = "0.5.0"
edition = "2024"

[features]
# Off by default, so the shipped build cannot be sped up from a URL. The e2e
# webServer turns it on; `trunk build --release` in the release workflow does
# not. See `apply_test_time_scale`.
test-hooks = []

[dependencies]
# `system_clipboard` is what makes COPY SAVE reach the desktop's real clipboard.
# Without it `bevy_clipboard` falls back to an in-process buffer, and the button
# would appear to work while putting the run somewhere no player can paste from.
bevy = { version = "0.19.1", features = ["system_clipboard"] }
bevy_flair = "0.8.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
fastrand = "2.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
atomic-write-file = "0.3"
directories = "6.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Location", "Performance", "Storage", "Window", "console"] }

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
