[package]
name = "banana-monkey-incremental"
version = "0.2.0"
edition = "2024"

[features]
# Off by default, so the shipped build cannot be sped up from a URL. The e2e
# webServer turns it on; `trunk build --release` in the release workflow does
# not. See `apply_test_time_scale`.
test-hooks = []

[dependencies]
bevy = "0.19.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
fastrand = "2.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
atomic-write-file = "0.3"
directories = "6.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Location", "Performance", "Storage", "Window"] }

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
